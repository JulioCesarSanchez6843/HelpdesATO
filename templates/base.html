<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Helpdesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand navbar-light bg-white border-bottom px-3">
        <span class="navbar-brand fw-bold">HD Helpdesk</span>
        <div class="navbar-nav me-auto">
            {% if user.es_admin %}
                <a class="nav-link" href="{% url 'lista_usuarios' %}">Usuarios</a>
            {% endif %}
        </div>
        <div class="navbar-nav align-items-center">
            <span class="navbar-text mx-2">{{ user.nombre }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-secondary">Salir</button>
            </form>
        </div>
    </nav>
    {% endif %}

    <div class="container mt-4">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
