<div class="card shadow-sm border-0 mb-3">
    <button
        class="btn text-start d-flex justify-content-between align-items-center p-3"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#historialTicket"
        aria-expanded="false"
        aria-controls="historialTicket"
    >
        <span class="fw-semibold">
            <i class="bi bi-clock-history me-1"></i>Historial de actividad
            <span class="badge bg-secondary-subtle text-secondary-emphasis ms-1">{{ historial|length }}</span>
        </span>
        <i class="bi bi-chevron-down"></i>
    </button>

    <div class="collapse" id="historialTicket">
        <ul class="list-group list-group-flush border-top">
            {% for evento in historial %}
                <li class="list-group-item">
                    <div class="d-flex justify-content-between gap-2">
                        <strong class="small">{{ evento.get_tipo_display }}</strong>
                        <small class="text-muted text-nowrap">{{ evento.fecha|date:"d/m/Y H:i" }}</small>
                    </div>
                    <div class="small">{{ evento.contenido|linebreaksbr }}</div>
                    <small class="text-muted">por {{ evento.usuario }}</small>
                </li>
            {% empty %}
                <li class="list-group-item text-muted small">Sin actividad todavía.</li>
            {% endfor %}
        </ul>
    </div>
</div>
